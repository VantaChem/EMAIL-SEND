<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact VantaChem</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:Segoe UI,Arial,sans-serif;background:#f5f5f5;color:#404040}
  .box{background:#fff;padding:36px 48px 40px;border-radius:16px;text-align:center;
       box-shadow:0 4px 20px rgba(0,0,0,.08);max-width:420px;border-top:6px solid #799B2C}
  .logo{max-width:220px;max-height:80px;margin:0 auto 24px;display:block}
  h1{font-size:20px;margin:0 0 6px}
  p{margin:0 0 24px;color:#666}
  a.btn{display:block;padding:14px 20px;border-radius:10px;text-decoration:none;
        font-weight:600;font-size:16px;margin-top:12px}
  .primary{background:#799B2C;color:#fff}
  .secondary{background:#fff;color:#799B2C;border:2px solid #799B2C}
  .foot{margin-top:28px;font-size:12px;color:#999}
</style></head>
<body>
<div class="box">
  <img class="logo" src="logo.png" alt="VantaChem">
  <div id="content"><h1>Invalid link</h1></div>
  <div class="foot">VantaChem • Oilfield Chemical Solutions</div>
</div>
<script>
  var to = new URLSearchParams(location.search).get('to') || '';
  if (/^[^@\s]+@vanta-chem\.com$/i.test(to)) {
    document.getElementById('content').innerHTML =
      '<h1>Email ' + to + '</h1><p>Choose how you\'d like to send your message.</p>' +
      '<a class="btn primary" id="mail" href="mailto:' + to + '">Open my email app</a>' +
      '<a class="btn secondary" href="https://outlook.office.com/mail/deeplink/compose?to=' + to + '">Use Outlook on the web</a>';
    try { location.href = 'mailto:' + to; } catch (e) {}
    document.getElementById('mail').addEventListener('click', function () {
      setTimeout(function () { window.close(); }, 1500);
    });
  }
</script>
</body></html>
